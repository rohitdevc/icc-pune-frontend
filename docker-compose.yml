name: icc-frontend

services:
  icc-web:
    container_name: icc-frontend

    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PATH: ${NEXT_PUBLIC_PATH}
        BASEPATH_PREFIX: ${BASEPATH_PREFIX}
        ASSET_PREFIX: ${ASSET_PREFIX}
        API_DOMAIN_NAME: ${API_DOMAIN_NAME}

    env_file:
      - .env

    volumes:
      - ./public:/app/public

    environment:
      NODE_ENV: production
      PORT: 2978
      HOSTNAME: "0.0.0.0"

    ports:
      - "2978:2978"

    command: node server.js
    restart: unless-stopped